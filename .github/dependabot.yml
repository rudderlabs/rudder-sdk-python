version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Routine updates only; security updates are advisory-driven.
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ['*']
    labels:
      - dependencies
      - python
      - dependabot

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude:
        - 'rudderlabs/*'
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions:
        patterns: ['*']
    labels:
      - dependencies
      - github_actions
      - dependabot
