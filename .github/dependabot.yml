version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Routine updates only; security updates are advisory-driven.
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
      - dependabot

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github_actions
      - dependabot
