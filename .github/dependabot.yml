version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Routine updates only; security updates are advisory-driven.
      interval: quarterly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
      - dependabot

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependencies
      - github_actions
      - dependabot
