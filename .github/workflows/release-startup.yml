name: Notify release startup failure

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  detect:
    # A monitor rerun must not send the initial release alert again.
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publishing startup
        id: startup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_startup.py

      - name: Notify Slack of startup failure
        if: steps.startup.outputs.notify == 'true'
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          payload-file-path: ${{ steps.startup.outputs.payload_path }}
