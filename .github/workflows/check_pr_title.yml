name: Check PR Title

on:
  pull_request:
    branches: ['master']
    types: ['opened', 'reopened', 'edited', 'synchronize']

permissions:
  contents: read

jobs:
  check_pr_title:
    name: Check PR title
    runs-on: arc-amd64
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check PR title
        uses: rudderlabs/github-action-check-pr-title@e5718471c8eebd75c51a10ccce35f2cf33d18c04 # v1.0.12
