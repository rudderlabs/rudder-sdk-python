name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.validate.outputs.package-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Validate release tag and package version
        id: validate
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          package_version="$(python -c 'import runpy; print(runpy.run_path("rudderstack/analytics/version.py")["VERSION"])')"
          if [[ "v${package_version}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${package_version}" >&2
            exit 1
          fi

          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "package-version=${package_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools and package dependencies
        run: ./setup_env.sh

      - name: Build distributions
        # setup.py imports runtime dependencies while reading the version, so
        # the existing releases cannot use build's isolated environment.
        run: python -m build --no-isolation

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rudder-sdk-python
    permissions:
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: false

  accept-published:
    name: Accept exact public package
    needs: [build, publish]
    uses: ./.github/workflows/accept-published-package.yml
    with:
      package-version: ${{ needs.build.outputs.package-version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-slack:
    name: Notify Slack
    if: ${{ always() }}
    needs: [build, publish, accept-published]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare release notification
        id: notification
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.package-version || github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          ACCEPT_RESULT: ${{ needs.accept-published.result }}
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          date_utc="$(date -u +%Y-%m-%d)"
          if [[ "$BUILD_RESULT" == success && "$PUBLISH_RESULT" == success && "$ACCEPT_RESULT" == success ]]; then
            status='release complete'
            registry='exact public PyPI version verified'
            acceptance='full delivery and cleanup passed'
          elif [[ "$PUBLISH_RESULT" == success ]]; then
            status='published; validation failed or incomplete'
            registry='published on PyPI; validation failed or incomplete'
            acceptance='full delivery and cleanup failed or incomplete'
          else
            status='build or upload failed or incomplete'
            registry='upload not confirmed'
            acceptance='not run'
          fi

          root="Python SDK v${version} · ${date_utc} · ${status}"
          root+=$'\n'"CC: <!subteam^S03SW7DM8P3>"
          details="*Release:* <${RELEASE_URL}|v${version}>"
          if [[ "$PUBLISH_RESULT" == success ]]; then
            details+=$'\n'"*PyPI:* <https://pypi.org/project/rudder-sdk-python/${version}/|rudder-sdk-python ${version}>"
          fi
          details+=$'\n'"*Registry:* ${registry}"
          details+=$'\n'"*Full E2E:* ${acceptance}"
          details+=$'\n'"*Checks:* build ${BUILD_RESULT}, upload ${PUBLISH_RESULT}, acceptance ${ACCEPT_RESULT}"
          details+=$'\n'"*Run:* <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|view workflow>"
          if [[ "$PUBLISH_RESULT" == success && "$ACCEPT_RESULT" != success ]]; then
            details+=$'\n'"*Retry:* run Published Python SDK E2E at the same release tag; validation only."
          fi
          {
            echo "root_payload=$(jq -nc --arg text "$root" '{text: $text, unfurl_links: false, unfurl_media: false}')"
            echo "detail_json=$(jq -nc --arg text "$details" '$text')"
          } >> "$GITHUB_OUTPUT"

      - name: Post release status to Slack
        id: root
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          payload: ${{ steps.notification.outputs.root_payload }}

      - name: Post release details in thread
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          payload: |
            {
              "text": ${{ steps.notification.outputs.detail_json }},
              "thread_ts": "${{ steps.root.outputs.ts }}",
              "reply_broadcast": false,
              "unfurl_links": false,
              "unfurl_media": false
            }
