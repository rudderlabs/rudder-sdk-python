sonar.projectKey=rudderlabs_rudder-sdk-python
sonar.organization=rudderlabs
sonar.projectName=rudder-sdk-python
sonar.qualitygate.wait=false

sonar.links.scm=https://github.com/rudderlabs/rudder-sdk-python
sonar.links.issue=https://github.com/rudderlabs/rudder-sdk-python/issues

# Sources and tests
sonar.sources=rudderstack
sonar.exclusions=rudderstack/analytics/test/**
sonar.tests=rudderstack/analytics/test
sonar.python.version=3.8, 3.9, 3.10, 3.11, 3.12

# Coverage report from the SonarCloud workflow (coverage.py, configured in setup.cfg)
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
